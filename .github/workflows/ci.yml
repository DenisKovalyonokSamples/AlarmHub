name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch: CI time is cheaper than stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AlarmHub.slnx

      - name: Build
        run: dotnet build AlarmHub.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/AlarmHub.UnitTests/AlarmHub.UnitTests.csproj -c Release --no-build

      - name: Architecture tests
        run: dotnet test tests/AlarmHub.ArchitectureTests/AlarmHub.ArchitectureTests.csproj -c Release --no-build

      # Testcontainers starts PostgreSQL on the runner, so the HTTP contract is tested for real.
      - name: Integration tests
        run: dotnet test tests/AlarmHub.IntegrationTests/AlarmHub.IntegrationTests.csproj -c Release --no-build

  docker:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: AlarmHub.Api
            image: api
          - service: AlarmHub.Ingest
            image: ingest
          - service: AlarmHub.Identity
            image: identity
          - service: AlarmHub.Processing
            image: processing
          - service: AlarmHub.Notifications
            image: notifications
    steps:
      - uses: actions/checkout@v4

      # Docker requires a lowercase repository name, so the service id is mapped to a slug.
      - name: Build image
        run: docker build -f src/${{ matrix.service }}/Dockerfile -t alarmhub/${{ matrix.image }}:${{ github.sha }} .
