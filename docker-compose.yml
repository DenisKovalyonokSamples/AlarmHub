# Local development stack for AlarmHub.
# Core infrastructure always starts; the five services run under the "app" profile so you can
# either run them with `dotnet run` (fast inner loop) or fully in containers:
#   docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:17-alpine
    container_name: alarmhub-postgres
    environment:
      POSTGRES_USER: alarm
      POSTGRES_PASSWORD: alarm
      POSTGRES_DB: alarmhub_api
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - alarmhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alarm -d alarmhub_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service Bus emulator requires a SQL Server instance for its metadata store.
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: alarmhub-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AlarmHub!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'AlarmHub!2026' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: alarmhub-servicebus
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "AlarmHub!2026"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./deploy/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  # Receives OTLP from all services and prints spans, so one trace can be followed end to end.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: alarmhub-otel
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otel/config.yaml:ro

  identity:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/AlarmHub.Identity/Dockerfile
    container_name: alarmhub-identity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=alarmhub_identity;Username=alarm;Password=alarm
      Identity__DemoClientSecret: dev-secret-change-me
      Identity__Issuer: http://identity:8080/
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "5082:8080"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/AlarmHub.Api/Dockerfile
    container_name: alarmhub-api
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AlarmHub: Host=postgres;Port=5432;Database=alarmhub_api;Username=alarm;Password=alarm
      Auth__Authority: http://identity:8080
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "5080:8080"

  ingest:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/AlarmHub.Ingest/Dockerfile
    container_name: alarmhub-ingest
    depends_on:
      postgres:
        condition: service_healthy
      servicebus:
        condition: service_started
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Ingest: Host=postgres;Port=5432;Database=alarmhub_ingest;Username=alarm;Password=alarm
      ConnectionStrings__ServiceBus: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Services__ApiBaseAddress: http://api:8080
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "5081:8080"

  processing:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/AlarmHub.Processing/Dockerfile
    container_name: alarmhub-processing
    depends_on:
      postgres:
        condition: service_healthy
      servicebus:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Processing: Host=postgres;Port=5432;Database=alarmhub_processing;Username=alarm;Password=alarm
      ConnectionStrings__ServiceBus: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Services__ApiBaseAddress: http://api:8080
      OpenTelemetry__Endpoint: http://otel-collector:4317

  notifications:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/AlarmHub.Notifications/Dockerfile
    container_name: alarmhub-notifications
    depends_on:
      postgres:
        condition: service_healthy
      servicebus:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=alarmhub_notifications;Username=alarm;Password=alarm
      ConnectionStrings__ServiceBus: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Notifications__DefaultRecipient: operations@alarmhub.local
      OpenTelemetry__Endpoint: http://otel-collector:4317

volumes:
  alarmhub-pgdata:

