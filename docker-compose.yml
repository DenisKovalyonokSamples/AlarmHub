# Local development stack for AlarmHub.
# One Postgres instance hosts one database per service; the Service Bus emulator provides the
# topics/subscriptions used by ingest, processing and notifications.
services:
  postgres:
    image: postgres:17-alpine
    container_name: alarmhub-postgres
    environment:
      POSTGRES_USER: alarm
      POSTGRES_PASSWORD: alarm
      POSTGRES_DB: alarmhub_api
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - alarmhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alarm -d alarmhub_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service Bus emulator requires a SQL Server instance for its metadata store.
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: alarmhub-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AlarmHub!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'AlarmHub!2026' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: alarmhub-servicebus
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "AlarmHub!2026"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./deploy/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  # Receives OTLP from all services and prints spans, so one trace can be followed end to end.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: alarmhub-otel
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otel/config.yaml:ro

volumes:
  alarmhub-pgdata:
